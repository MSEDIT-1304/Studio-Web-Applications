<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Studio Web & Applications</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<nav class="navbar">
    <a href="/">Accueil</a>
    <a href="/services">Mes services</a>
    <a href="/parcours">Mon parcours professionnel</a>
    <a href="/contact">Contact</a>
    <a href="/panier">Panier</a>
</nav>

<img src="{{ url_for('static', filename='images/banniere_msedit.png') }}" class="banniere">

<div class="contenu">

<img src="{{ url_for('static', filename='images/logo-msedit.png') }}" class="logo">

<h2>Contact</h2>

<p>
Vous souhaitez créer un site internet, une application ou obtenir un devis ?
</p>

<form class="contact-form" method="post">

<p>
<label><strong>Nom et prénom</strong></label><br>
<input type="text" name="nom" required>
</p>

<p>
<label><strong>Entreprise (facultatif)</strong></label><br>
<input type="text" name="entreprise">
</p>

<p>
<label><strong>Adresse e-mail</strong></label><br>
<input type="email" name="email" required>
</p>

<p>
<label><strong>Téléphone</strong></label><br>
<input type="tel" name="telephone">
</p>

<p>
<label><strong>Votre projet</strong></label><br>
<textarea name="message" rows="8" required></textarea>
</p>

<p>
<button type="submit">Envoyer ma demande</button>
</p>

</form>

<p>
📧 contact@studioweb.fr
</p>

</div>

</body>

</html>
